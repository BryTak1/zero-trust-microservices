x-service: &service
  build: .
  image: zero-trust-services
  restart: unless-stopped

# Micro-segmentation: each network joins only the pair (or trio) of containers that must talk,
# so a compromised service cannot reach anything it has no business with.
networks:
  edge: {}
  gateway-auth: { internal: true }
  gateway-resource: { internal: true }
  gateway-audit: { internal: true }
  auth-resource: { internal: true }
  auth-audit: { internal: true }
  auth-db: { internal: true }
  resource-db: { internal: true }
  audit-db: { internal: true }

services:
  # The gateway is the only container reachable from outside, and it touches no database.
  gateway:
    <<: *service
    environment:
      SERVICE: gateway
      PORT: "8080"
      AUTH_URL: http://auth-service:3000
      RESOURCE_URL: http://resource-service:3000
      AUDIT_URL: http://audit-service:3000
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?Set GATEWAY_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge, gateway-auth, gateway-resource, gateway-audit]
    depends_on:
      - auth-service
      - resource-service
      - audit-service

  auth-service:
    <<: *service
    environment:
      SERVICE: auth-service
      DATABASE_URL: postgres://auth:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}@postgres-auth:5432/auth
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?Set GATEWAY_CLIENT_SECRET in .env}
    networks: [gateway-auth, auth-resource, auth-audit, auth-db]
    depends_on:
      postgres-auth:
        condition: service_healthy

  resource-service:
    <<: *service
    environment:
      SERVICE: resource-service
      AUTH_URL: http://auth-service:3000
      DATABASE_URL: postgres://resources:${RESOURCE_DB_PASSWORD:?Set RESOURCE_DB_PASSWORD in .env}@postgres-resources:5432/resources
    networks: [gateway-resource, auth-resource, resource-db]
    depends_on:
      postgres-resources:
        condition: service_healthy

  audit-service:
    <<: *service
    environment:
      SERVICE: audit-service
      AUTH_URL: http://auth-service:3000
      CASSANDRA_CONTACT_POINTS: cassandra
    networks: [gateway-audit, auth-audit, audit-db]
    depends_on:
      cassandra:
        condition: service_healthy

  # Separate instances with separate logins, so one service's credentials open nothing else.
  postgres-auth:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_DB: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks: [auth-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-resources:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: resources
      POSTGRES_DB: resources
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:?Set RESOURCE_DB_PASSWORD in .env}
    volumes:
      - postgres-resources-data:/var/lib/postgresql/data
    networks: [resource-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resources -d resources"]
      interval: 5s
      timeout: 5s
      retries: 12

  cassandra:
    image: cassandra:5
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks: [audit-db]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  postgres-auth-data:
  postgres-resources-data:
  cassandra-data:
