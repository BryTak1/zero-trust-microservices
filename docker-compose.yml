x-service: &service
  build: .
  image: zero-trust-services
  restart: unless-stopped

services:
  # The gateway is the only container reachable from outside the Compose network.
  gateway:
    <<: *service
    environment:
      SERVICE: gateway
      PORT: "8080"
      AUTH_URL: http://auth-service:3000
      RESOURCE_URL: http://resource-service:3000
      AUDIT_URL: http://audit-service:3000
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?Set GATEWAY_CLIENT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - auth-service
      - resource-service
      - audit-service

  auth-service:
    <<: *service
    environment:
      SERVICE: auth-service
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/auth
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?Set GATEWAY_CLIENT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy

  resource-service:
    <<: *service
    environment:
      SERVICE: resource-service
      AUTH_URL: http://auth-service:3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/resources
    depends_on:
      postgres:
        condition: service_healthy

  audit-service:
    <<: *service
    environment:
      SERVICE: audit-service
      AUTH_URL: http://auth-service:3000
      CASSANDRA_CONTACT_POINTS: cassandra
    depends_on:
      cassandra:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  cassandra:
    image: cassandra:5
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

volumes:
  postgres-data:
  cassandra-data:
